name: cb-catalog-release
run-name: ${{ inputs.helio_execution_id || format('Catalog lane B release {0}', github.sha) }}
# Catalog lane B (17 Oct 2026): application caller for the BlueMatrix Environment Catalog cases
# on GitHub App B. Calls the central catalog template by its full name. No real deployment.
on:
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_target_environment:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    uses: helloangular/helio-client-capacity-20260916/.github/workflows/cb-catalog-deploy.yml@cb-catalog-20261017
    with:
      helio_execution_id: ${{ inputs.helio_execution_id || '' }}
      helio_target_environment: ${{ inputs.helio_target_environment || '' }}
